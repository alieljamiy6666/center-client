# Center Client: builds the client on GitHub's servers every time code is pushed,
# then puts it online at https://alieljamiy6666.github.io/center-client/
# You can also start it by hand from the Actions tab ("Run workflow").
# When it finishes, download the results from the bottom of the run page (under "Artifacts").

name: Build Center Client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one website update at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java 17 (recommended for TeaVM)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: "Step 1 of 3: Pack the game assets (CompileEPK)"
        run: sh CompileEPK.sh

      - name: "Step 2 of 3: Turn the Java code into JavaScript (CompileJS)"
        run: sh CompileJS.sh

      - name: "Step 3 of 3: Make the single offline HTML file (MakeOfflineDownload)"
        run: sh MakeOfflineDownload.sh

      - name: Upload the offline HTML file
        uses: actions/upload-artifact@v4
        with:
          name: offline-html
          path: javascript/Center_Client_1.12.2_Offline.html
          if-no-files-found: error

      - name: Upload the web build (for hosting online)
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            javascript/index.html
            javascript/classes.js
            javascript/assets.epk
            javascript/favicon.png
            javascript/lang/
          if-no-files-found: error

      - name: Get the website files ready
        run: |
          mkdir site
          cp javascript/index.html javascript/classes.js javascript/assets.epk javascript/favicon.png site/
          cp -r javascript/lang site/

      - name: Upload the website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Puts the web build online with GitHub Pages:
  # https://alieljamiy6666.github.io/center-client/
  # Needs Settings -> Pages -> Source set to "GitHub Actions".
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Put the website online
        id: deployment
        uses: actions/deploy-pages@v4
