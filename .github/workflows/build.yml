# Center Client: builds the client on GitHub's servers every time code is pushed.
# You can also start it by hand from the Actions tab ("Run workflow").
# When it finishes, download the results from the bottom of the run page (under "Artifacts").

name: Build Center Client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java 17 (recommended for TeaVM)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: "Step 1 of 3: Pack the game assets (CompileEPK)"
        run: sh CompileEPK.sh

      - name: "Step 2 of 3: Turn the Java code into JavaScript (CompileJS)"
        run: sh CompileJS.sh

      - name: "Step 3 of 3: Make the single offline HTML file (MakeOfflineDownload)"
        run: sh MakeOfflineDownload.sh

      - name: Upload the offline HTML file
        uses: actions/upload-artifact@v4
        with:
          name: offline-html
          path: javascript/Center_Client_1.12.2_Offline.html
          if-no-files-found: error

      - name: Upload the web build (for hosting online)
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            javascript/index.html
            javascript/classes.js
            javascript/assets.epk
            javascript/favicon.png
            javascript/lang/
          if-no-files-found: error

      # Copies the web build into the public center-client-play repo, which
      # GitHub Pages turns into the test website. Needs the SITE_DEPLOY_TOKEN
      # secret; without it this step just skips.
      - name: Publish the test website
        if: github.ref == 'refs/heads/main'
        env:
          SITE_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
          SITE_REPO: alieljamiy6666/center-client-play
        run: |
          if [ -z "$SITE_TOKEN" ]; then
            echo "No SITE_DEPLOY_TOKEN secret yet, so the website was not updated."
            exit 0
          fi
          mkdir site
          cp javascript/index.html javascript/classes.js javascript/assets.epk javascript/favicon.png site/
          cp -r javascript/lang site/
          touch site/.nojekyll
          cd site
          git init -q -b main
          git config user.name "Center Client build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Center Client build ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${SITE_TOKEN}@github.com/${SITE_REPO}.git" main
          echo "Website updated: https://alieljamiy6666.github.io/center-client-play/"
